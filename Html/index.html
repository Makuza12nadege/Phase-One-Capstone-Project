<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { width: 100%; overflow-x: hidden; }
    @media (min-width: 640px) { #menu-btn { display: none; } #desktop-links { display: flex; } }
    @media (max-width: 639px) { #desktop-links { display: none; } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-gray-800 text-white px-6 py-4">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold">Book Explorer</h1>
      <button id="menu-btn" class="text-2xl">☰</button>
      <ul id="desktop-links" class="gap-6 text-sm">
        <li><a href="index.html" class="font-bold underline">Home</a></li>
        <li><a href="favorites.html" class="hover:underline">Favorites</a></li>
        <li><a href="about.html" class="hover:underline">About</a></li>
      </ul>
    </div>
    <ul id="mobile-menu" class="hidden flex-col gap-2 mt-3 text-sm">
      <li><a href="index.html" class="font-bold underline">Home</a></li>
      <li><a href="favorites.html" class="hover:underline">Favorites</a></li>
      <li><a href="about.html" class="hover:underline">About</a></li>
    </ul>
  </nav>

  <!-- Hero -->
  <section class="bg-blue-100 text-center py-16 px-4">
    <h2 class="text-3xl font-bold mb-3">Discover Your Next Book</h2>
    <p class="text-gray-600 mb-6">Browse thousands of books across all genres.</p>
    <a href="#books" class="bg-emerald-600 text-white px-6 py-3 rounded-lg hover:bg-emerald-700">Explore Books</a>
  </section>

  <!-- Books Section -->
  <section id="books" class="px-4 py-12">
    <h3 class="text-2xl font-semibold mb-6 text-center">Featured Books</h3>

    <div class="flex gap-2 mb-8 max-w-md mx-auto">
      <input id="search-input" type="text" placeholder="Search books..."
        class="flex-1 border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-orange-500" />
      <button id="search-btn" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700">Search</button>
    </div>

    <p id="loading" class="text-center text-gray-500 hidden">Loading...</p>
    <p id="no-results" class="text-center text-gray-400 hidden">No results found.</p>
    <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center py-4 mt-8">
    <p>&copy; 2026 Book Explorer</p>
  </footer>

  <script type="module">
    import { fetchBooks } from "../JavaScript/fetchBooks.js";
    import { addFavorite } from "../JavaScript/favorites.js";

    const grid = document.getElementById("book-grid");
    const loading = document.getElementById("loading");
    const noResults = document.getElementById("no-results");
    const searchInput = document.getElementById("search-input");

    document.getElementById("menu-btn").addEventListener("click", () => {
      const menu = document.getElementById("mobile-menu");
      menu.classList.toggle("hidden");
      menu.classList.toggle("flex");
    });

    function renderBooks(books) {
      grid.innerHTML = "";
      if (books.length === 0) { noResults.classList.remove("hidden"); return; }
      noResults.classList.add("hidden");
      books.forEach(book => {
        const cover = book.cover
          ? `<img src="${book.cover}" class="h-40 w-full object-cover rounded mb-4">`
          : `<div class="bg-gray-200 h-40 rounded mb-4"></div>`;
        grid.innerHTML += `
          <div class="bg-white rounded-lg shadow p-4">
            ${cover}
            <h4 class="font-bold">${book.title}</h4>
            <p class="text-gray-500 text-sm">${book.author}</p>
            <button onclick='addToFav(${JSON.stringify(book)})'
              class="mt-3 w-full bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700">
              Add to Favorites
            </button>
          </div>`;
      });
    }

    async function loadBooks(query = "fiction") {
      loading.classList.remove("hidden");
      grid.innerHTML = "";
      noResults.classList.add("hidden");
      const books = await fetchBooks(query);
      loading.classList.add("hidden");
      renderBooks(books);
    }

    document.getElementById("search-btn").addEventListener("click", () => {
      const query = searchInput.value.trim();
      if (query) loadBooks(query);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadBooks(searchInput.value.trim());
    });

    window.addToFav = function(book) {
      addFavorite(book);
      alert(`"${book.title}" added to favorites!`);
    };

    loadBooks();
  </script>

</body>
</html>
