<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { width: 100%; overflow-x: hidden; }
    @media (min-width: 640px) { #menu-btn { display: none; } #desktop-links { display: flex; } }
    @media (max-width: 639px) { #desktop-links { display: none; } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-gray-800 text-white px-6 py-4">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold">Book Explorer</h1>
      <button id="menu-btn" class="text-2xl">☰</button>
      <ul id="desktop-links" class="gap-6 text-sm">
        <li><a href="index.html" class="font-bold underline">Home</a></li>
        <li><a href="favorites.html" class="hover:underline">Favorites</a></li>
      </ul>
    </div>
    <ul id="mobile-menu" class="hidden flex-col gap-2 mt-3 text-sm">
      <li><a href="index.html" class="font-bold underline">Home</a></li>
      <li><a href="favorites.html" class="hover:underline">Favorites</a></li>
    </ul>
  </nav>

  <!-- Hero -->
  <section class="bg-blue-100 text-center py-16 px-4">
    <h2 class="text-3xl font-bold mb-3">Discover Your Next Book</h2>
    <p class="text-gray-600 mb-6">Browse thousands of books across all genres.</p>
    <a href="#books" class="bg-orange-600 text-white px-6 py-3 rounded-lg hover:bg-orange-700">Explore Books</a>
  </section>

  <!-- Book Grid -->
  <section id="books" class="px-4 py-12">
    <h3 class="text-2xl font-semibold mb-6 text-center">Featured Books</h3>
    <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center py-4 mt-8">
    <p>&copy; 2025 Book Explorer. All rights reserved.</p>
  </footer>

  <script type="module">
    import { addFavorite } from "./favorites.js";

    document.getElementById("menu-btn").addEventListener("click", () => {
      const menu = document.getElementById("mobile-menu");
      menu.classList.toggle("hidden");
      menu.classList.toggle("flex");
    });

    // Hardcoded books
    const books = [
      { id: 1, title: "The Great Gatsby", author: "F. Scott Fitzgerald" },
      { id: 2, title: "To Kill a Mockingbird", author: "Harper Lee" },
      { id: 3, title: "1984", author: "George Orwell" },
      { id: 4, title: "Pride and Prejudice", author: "Jane Austen" },
      { id: 5, title: "The Alchemist", author: "Paulo Coelho" },
      { id: 6, title: "Brave New World", author: "Aldous Huxley" },
    ];

    const grid = document.getElementById("book-grid");
    books.forEach(book => {
      grid.innerHTML += `
        <div class="bg-white rounded-lg shadow p-4">
          <div class="bg-gray-200 h-40 rounded mb-4"></div>
          <h4 class="font-bold">${book.title}</h4>
          <p class="text-gray-500 text-sm">${book.author}</p>
          <button onclick="addToFav(${book.id})"
            class="mt-3 w-full bg-orange-600 text-white py-2 rounded hover:bg-orange-700">
            Add to Favorites
          </button>
        </div>`;
    });

    window.addToFav = function(id) {
      const book = books.find(b => b.id === id);
      addFavorite(book);
      alert(`"${book.title}" added to favorites!`);
    };
  </script>

</body>
</html>
