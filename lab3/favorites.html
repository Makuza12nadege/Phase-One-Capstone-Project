<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorites - Book Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { width: 100%; overflow-x: hidden; }
    @media (min-width: 640px) { #menu-btn { display: none; } #desktop-links { display: flex; } }
    @media (max-width: 639px) { #desktop-links { display: none; } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-gray-800 text-white px-6 py-4">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold">Book Explorer</h1>
      <button id="menu-btn" class="text-2xl">☰</button>
      <ul id="desktop-links" class="gap-6 text-sm">
        <li><a href="index.html" class="hover:underline">Home</a></li>
        <li><a href="favorites.html" class="font-bold underline">Favorites</a></li>
      </ul>
    </div>
    <ul id="mobile-menu" class="hidden flex-col gap-2 mt-3 text-sm">
      <li><a href="index.html" class="hover:underline">Home</a></li>
      <li><a href="favorites.html" class="font-bold underline">Favorites</a></li>
    </ul>
  </nav>

  <!-- Favorites Section -->
  <section class="px-4 py-12">
    <h2 class="text-2xl font-semibold mb-6 text-center">My Favorite Books</h2>
    <div id="favorites-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <p id="empty-msg" class="text-center text-gray-400 mt-10 hidden">No favorites yet. Go add some!</p>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center py-4 mt-8">
    <p>&copy; 2025 Book Explorer. All rights reserved.</p>
  </footer>

  <script type="module">
    import { getFavorites, removeFavorite } from "./favorites.js";

    const grid = document.getElementById("favorites-grid");
    const emptyMsg = document.getElementById("empty-msg");

    document.getElementById("menu-btn").addEventListener("click", () => {
      const menu = document.getElementById("mobile-menu");
      menu.classList.toggle("hidden");
      menu.classList.toggle("flex");
    });

    function renderFavorites() {
      const favorites = getFavorites();
      grid.innerHTML = "";
      if (favorites.length === 0) { emptyMsg.classList.remove("hidden"); return; }
      emptyMsg.classList.add("hidden");
      favorites.forEach(book => {
        const cover = book.cover
          ? `<img src="${book.cover}" class="h-40 w-full object-cover rounded mb-4">`
          : `<div class="bg-gray-200 h-40 rounded mb-4"></div>`;
        grid.innerHTML += `
          <div class="bg-white rounded-lg shadow p-4">
            ${cover}
            <h4 class="font-bold">${book.title}</h4>
            <p class="text-gray-500 text-sm">${book.author}</p>
            <button onclick='removeBook(${JSON.stringify(book.id)})'
              class="mt-3 w-full bg-red-500 text-white py-2 rounded hover:bg-red-600">
              Remove
            </button>
          </div>`;
      });
    }

    window.removeBook = function(id) {
      if (confirm("Are you sure you want to remove this book?")) {
        removeFavorite(id);
        renderFavorites();
      }
    };

    renderFavorites();
  </script>

</body>
</html>
